[project]
name = "zaro-api"
version = "0.1.0"
description = "ZARO Commerce + OS API - backend for the furniture workshop platform."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "redis>=5,<6",
    "argon2-cffi>=23.1,<25",
    "PyJWT>=2.9,<3",
    "cryptography>=50,<51",
    "python-multipart>=0.0.9,<1",
    "aiofiles>=24,<25",
    "boto3>=1.35,<2",
    "httpx>=0.27,<1",
    "orjson>=3.10,<4",
    "email-validator>=2.2,<3",
    "structlog>=24.4,<26",
    "python-magic>=0.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "anyio>=4.5,<5",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    "mypy>=1.11,<2",
    "types-aiofiles>=24,<25",
    "fakeredis>=2.24,<3",
    "aiosqlite>=0.20,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
