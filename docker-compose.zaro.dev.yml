# =============================================================================
# ZARO Development overrides
# Usage: docker compose -f docker-compose.zaro.yml -f docker-compose.zaro.dev.yml up
# =============================================================================

services:
  zaro-api:
    volumes:
      - ./apps/zaro-api/app:/app/app
      - ./apps/zaro-api/alembic:/app/alembic
      - ./apps/zaro-api/alembic.ini:/app/alembic.ini
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  zaro-web:
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001/api/v1
    command: ["pnpm", "--filter", "@zaro/web", "dev"]
    volumes:
      - ./apps/zaro-web:/repo/apps/zaro-web
      - ./packages/zaro-sdk:/repo/packages/zaro-sdk
