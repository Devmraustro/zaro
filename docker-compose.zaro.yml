# =============================================================================
# ZARO Services - standalone compose stack (postgres, redis, api, web)
# Usage: docker compose -f docker-compose.zaro.yml up -d --build
#
# Development with hot reload:
#   docker compose -f docker-compose.zaro.yml -f docker-compose.zaro.dev.yml up
#
# Hardening (Phase 1.4):
# - Postgres/Redis publish to loopback only; they are never reachable from
#   other machines on the dev network
# - Redis requires a password and lives on an internal network unreachable
#   from outside the compose project
# - application containers run with no-new-privileges
# =============================================================================

services:
  zaro-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zaro
      POSTGRES_USER: zaro
      POSTGRES_PASSWORD: ${ZARO_POSTGRES_PASSWORD:-zaro_dev_password}
    ports:
      - "127.0.0.1:${ZARO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - zaro-pgdata:/var/lib/postgresql/data
    networks:
      - zaro-internal
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaro -d zaro"]
      interval: 5s
      timeout: 5s
      retries: 10

  zaro-redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--port",
        "6380",
        "--requirepass",
        "${ZARO_REDIS_PASSWORD:-zaro_dev_redis_password}",
      ]
    ports:
      - "127.0.0.1:${ZARO_REDIS_PORT:-6380}:6380"
    volumes:
      - zaro-redisdata:/data
    networks:
      - zaro-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -p 6380 --no-auth-warning -a '${ZARO_REDIS_PASSWORD:-zaro_dev_redis_password}' ping | grep PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  zaro-api:
    build:
      context: .
      dockerfile: docker/zaro-api.Dockerfile
    environment:
      # Local stack defaults to development posture. To run this same compose
      # file as a real deployment, export: ZARO_ENVIRONMENT=production,
      # ZARO_COOKIE_SAMESITE=none (cross-site web/API) or strict (single
      # domain), ZARO_CORS_ORIGINS=["https://<web-origin>"] plus strong
      # ZARO_SECRET_KEY / ZARO_ENCRYPTION_KEY. The API refuses to boot in
      # production with lax cookies, wildcard CORS, or dev secrets.
      ZARO_ENVIRONMENT: ${ZARO_ENVIRONMENT:-development}
      ZARO_DEBUG: ${ZARO_DEBUG:-true}
      ZARO_DATABASE_URL: postgresql+asyncpg://zaro:${ZARO_POSTGRES_PASSWORD:-zaro_dev_password}@zaro-postgres:5432/zaro
      ZARO_REDIS_URL: redis://:${ZARO_REDIS_PASSWORD:-zaro_dev_redis_password}@zaro-redis:6380/0
      ZARO_SECRET_KEY: ${ZARO_SECRET_KEY:-dev-zaro-secret-key-change-in-production}
      ZARO_ENCRYPTION_KEY: ${ZARO_ENCRYPTION_KEY:-}
      ZARO_CORS_ORIGINS: ${ZARO_CORS_ORIGINS:-["http://localhost:3001"]}
      ZARO_COOKIE_SAMESITE: ${ZARO_COOKIE_SAMESITE:-lax}
    depends_on:
      zaro-postgres:
        condition: service_healthy
      zaro-redis:
        condition: service_healthy
    ports:
      - "${ZARO_API_PORT:-8001}:8001"
    networks:
      - default
      - zaro-internal
    security_opt:
      - no-new-privileges:true

  zaro-web:
    build:
      context: .
      dockerfile: docker/zaro-web.Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_ZARO_API_BASE_URL:-http://localhost:8001/api/v1}
    depends_on:
      - zaro-api
    ports:
      - "${ZARO_WEB_PORT:-3001}:3001"
    security_opt:
      - no-new-privileges:true

volumes:
  zaro-pgdata:
  zaro-redisdata:

networks:
  zaro-internal:
    internal: true
